<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070e1b">
  <title>Birthday Night · Invitación exclusiva</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Italiana&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #ebc98c;
      --cream: #fff5df;
      --muted: #b5bed0;
      --blue: #0b1a31;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: #050b15; }
    body {
      margin: 0;
      min-height: 100svh;
      font-family: 'DM Sans', sans-serif;
      color: var(--cream);
      background: radial-gradient(ellipse at 15% 15%, #1a3858 0, transparent 38%),
                  radial-gradient(ellipse at 85% 75%, #182a47 0, transparent 45%), #050b15;
      display: grid;
      place-items: center;
      padding: 22px 14px;
      overflow-x: hidden;
    }
    .ambient { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    .ambient:before {
      content: '';
      position: absolute;
      inset: -50%;
      background: repeating-conic-gradient(from 0deg, #d5a95c08 0 1deg, transparent 1deg 20deg);
      animation: spin 90s linear infinite;
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(65px);
      background: #d8a95a24;
      width: 230px;
      height: 230px;
      top: 8%;
      right: -90px;
    }
    .orb.two { top: auto; bottom: 5%; left: -90px; background: #3268b32c; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .shell { width: min(100%, 480px); position: relative; z-index: 1; }
    .topline {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #d8c8ab;
      font-size: 10px;
      letter-spacing: 2.4px;
      text-transform: uppercase;
      margin: 0 6px 15px;
    }
    .topline span:last-child { color: #aeb7c9; }
    .card {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      border: 1px solid #d8b67775;
      border-radius: 24px;
      min-height: 570px;
      padding: 45px 28px 36px;
      text-align: center;
      background: linear-gradient(145deg, #162b44f0 0%, #081426f5 55%, #050b16fa 100%);
      box-shadow: 0 30px 80px #0009, 0 0 0 5px #ffffff04;
    }
    .card:before {
      content: '';
      position: absolute;
      inset: 12px;
      border: 1px solid #d7b67833;
      border-radius: 16px;
      pointer-events: none;
    }
    .card:after {
      content: '';
      position: absolute;
      width: 280px;
      height: 280px;
      border: 1px solid #e6c68b1c;
      border-radius: 50%;
      top: -180px;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
    }
    .spark {
      color: var(--gold);
      font-size: 30px;
      text-shadow: 0 0 30px #e8bd6d80;
      animation: glow 3s ease-in-out infinite;
    }
    @keyframes glow { 50% { opacity: .5; transform: scale(.9); } }
    .eyebrow {
      color: var(--gold);
      font-size: 10px;
      letter-spacing: 4px;
      font-weight: 700;
      text-transform: uppercase;
      margin: 20px 0 12px;
    }
    .display {
      font-family: Italiana, Georgia, serif;
      font-size: clamp(50px, 12vw, 74px);
      font-weight: 400;
      line-height: .98;
      margin: 14px 0;
      color: #f5e6c9;
    }
    .display em { font-style: normal; color: var(--gold); }
    .line {
      width: 115px;
      height: 1px;
      margin: 24px auto;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }
    .desc { font-size: 14px; line-height: 1.8; color: var(--muted); max-width: 340px; margin: 15px auto; }
    .input {
      width: 100%;
      margin: 16px 0 10px;
      padding: 17px 18px;
      border: 1px solid #e0be8059;
      border-radius: 12px;
      background: #fff1;
      color: #fff;
      font: 500 15px 'DM Sans', sans-serif;
      text-align: center;
      outline: none;
    }
    .input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px #e0be801c; }
    .input::placeholder { color: #9da8bb; }
    .btn {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      border: 0;
      border-radius: 100px;
      padding: 16px 23px;
      font: 700 11px 'DM Sans', sans-serif;
      letter-spacing: 1.5px;
      cursor: pointer;
      transition: transform .2s, filter .2s;
      min-height: 50px;
    }
    .btn:hover { transform: translateY(-2px); filter: brightness(1.1); }
    .btn:disabled { opacity: .55; cursor: wait; }
    .gold { background: linear-gradient(120deg, #ad7d3f, #f7dda6 48%, #bd9150); color: #142035; box-shadow: 0 10px 25px #d7a55a2e; }
    .outline { background: #fff1; color: #d5d9e0; border: 1px solid #d1d5dc66; }
    .full { width: 100%; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 24px; }
    .detail { padding: 16px 0; border-bottom: 1px solid #e6c88a27; }
    .detail:last-child { border: 0; }
    .label { font-size: 10px; letter-spacing: 2.7px; color: var(--gold); font-weight: 700; }
    .value { font-family: Italiana, Georgia, serif; font-size: 30px; margin: 5px 0 0; }
    .sub { font-size: 12px; color: var(--muted); line-height: 1.6; }
    .ticket {
      position: relative;
      border: 1px solid #d9b675;
      border-radius: 16px;
      margin: 20px 0;
      padding: 26px 17px;
      background: radial-gradient(ellipse at top, #284362 0%, #101f35 55%, #0b1527 100%);
    }
    .ticket:before, .ticket:after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #081426;
      top: 60%;
      border: 1px solid #d9b675;
    }
    .ticket:before { left: -11px; }
    .ticket:after { right: -11px; }
    .guest { font-family: Italiana, Georgia, serif; font-size: clamp(30px, 8vw, 46px); color: #fff1d6; overflow-wrap: anywhere; margin: 10px 0; }
    .status { min-height: 25px; font-size: 12px; line-height: 1.6; color: #e7c992; margin-top: 15px; }
    .foot { font-size: 10px; letter-spacing: 1.6px; color: #8998ad; text-align: center; margin-top: 18px; }
    .fade { animation: rise .55s cubic-bezier(.2, .8, .2, 1); }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    .confetti { position: fixed; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
    .piece { position: absolute; top: -25px; width: 7px; height: 14px; animation: fall 3s ease-in forwards; }
    @keyframes fall { to { transform: translate(var(--dx), 110vh) rotate(850deg); opacity: 0; } }
    a { color: var(--gold); }
    @media(max-width: 390px) {
      .card { padding: 35px 20px; min-height: 540px; }
      .topline { letter-spacing: 1.5px; }
      .btn { padding: 14px 17px; letter-spacing: .8px; }
    }
    @media(prefers-reduced-motion: reduce) {
      *, *:before, *:after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="ambient">
    <div class="orb"></div>
    <div class="orb two"></div>
  </div>
  <div id="confetti" class="confetti" aria-hidden="true"></div>
  <div class="shell">
    <div class="topline">
      <span>✦ &nbsp; THE PRIVATE INVITE</span>
      <span>23 · 10 · 26</span>
    </div>
    <main class="card">
      <div id="screen" class="fade">
        <div class="spark">✦</div>
        <div class="eyebrow">Una celebración especial</div>
        <h1 class="display">You're<br><em>Invited.</em></h1>
        <div class="line"></div>
        <p class="desc">Una noche, buenos momentos y personas que hacen la diferencia. Esta invitación tiene tu nombre.</p>
        <p class="desc" style="margin-bottom:0">¿Cómo te llamas?</p>
        <form id="nameForm">
          <input class="input" id="name" name="name" maxlength="55" autocomplete="name" placeholder="Escribe tu nombre" required>
          <button class="btn gold full" type="submit">ABRIR MI INVITACIÓN <span>↗</span></button>
        </form>
        <div class="status" id="status" role="status"></div>
      </div>
    </main>
    <div class="foot">CHELSEA · URDESA · GUAYAQUIL</div>
  </div>

  <script>
    'use strict';
    const ENDPOINT = 'https://formspree.io/f/xwlvdnyg';
    const EVENT = 'Cumpleaños · Chelsea · 23/10/2026 · 8:00 PM';
    const screen = document.getElementById('screen');
    let guest = '';
    let companion = '';
    let pending = false;

    const safe = s => s.replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));

    function render(html) {
      screen.classList.remove('fade');
      screen.innerHTML = html;
      void screen.offsetWidth;
      screen.classList.add('fade');
    }

    function status(t) {
      const el = document.getElementById('status');
      if (el) el.textContent = t;
    }

    function details() {
      return `
        <div class="detail">
          <div class="label">FECHA</div>
          <div class="value">Viernes 23 de octubre</div>
          <div class="sub">2026</div>
        </div>
        <div class="detail">
          <div class="label">HORA</div>
          <div class="value">Desde las 8:00 PM</div>
        </div>
        <div class="detail">
          <div class="label">LUGAR</div>
          <div class="value">Chelsea</div>
          <div class="sub">Urdesa · Víctor Emilio Estrada y Cedros<br>Guayaquil, Ecuador</div>
        </div>
      `;
    }

    document.getElementById('nameForm').addEventListener('submit', e => {
      e.preventDefault();
      const n = document.getElementById('name').value.trim();
      if (!n) {
        status('Escribe tu nombre para continuar.');
        return;
      }
      guest = n;
      showInvite();
    });

    function showInvite() {
      render(`
        <div class="spark">✦</div>
        <div class="eyebrow">Invitación personal</div>
        <h2 class="display" style="font-size:clamp(40px,10vw,60px)">Hola,<br><em>${safe(guest)}</em></h2>
        <p class="desc">¡Me encantaría que seas parte de mi cumpleaños! ✨</p>
        <div class="line"></div>
        ${details()}
        <p class="desc">¡Puedes venir con un acompañante! ¿Nos acompañas a celebrar?</p>
        <div class="actions">
          <button id="yes" class="btn gold">✦ CONFIRMAR ASISTENCIA</button>
          <button id="no" class="btn outline">NO PODRÉ IR</button>
        </div>
        <div class="status" id="status" role="status"></div>
      `);
      document.getElementById('yes').onclick = showCompanionStep;
      document.getElementById('no').onclick = () => respond(false);
    }

    function showCompanionStep() {
      render(`
        <div class="spark">✦</div>
        <div class="eyebrow">Confirma tu asistencia</div>
        <h2 class="display" style="font-size:clamp(38px,9vw,54px)">¡Qué alegría,<br><em>${safe(guest)}!</em></h2>
        <p class="desc">¿Vendrás con un acompañante?</p>
        <div class="actions">
          <button id="withCompanion" class="btn gold">SÍ, CON ACOMPAÑANTE</button>
          <button id="alone" class="btn outline">IRÉ SOLO/A</button>
        </div>
        <div id="companionArea"></div>
        <div class="status" id="status" role="status"></div>
      `);
      document.getElementById('alone').onclick = () => { companion = ''; respond(true); };
      document.getElementById('withCompanion').onclick = () => {
        document.getElementById('companionArea').innerHTML = `
          <form id="companionForm">
            <p class="desc">Escribe el nombre de tu acompañante:</p>
            <input id="companionName" class="input" type="text" maxlength="100" autocomplete="off" placeholder="Nombre y apellido del acompañante" required>
            <button class="btn gold" type="submit">CONFIRMAR LOS DOS ✦</button>
          </form>
        `;
        document.getElementById('companionForm').onsubmit = e => {
          e.preventDefault();
          const name = document.getElementById('companionName').value.trim();
          if (!name) {
            status('Ingresa el nombre de tu acompañante.');
            return;
          }
          companion = name;
          respond(true);
        };
        document.getElementById('companionName').focus();
      };
    }

    async function respond(attending) {
      if (pending) return;
      pending = true;
      screen.querySelectorAll('button').forEach(b => b.disabled = true);
      status('Guardando tu respuesta…');
      let saved = false;
      let error = '';
      
      try {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 10000);
        let response;
        try {
          response = await fetch(ENDPOINT, {
            method: 'POST',
            headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
            body: JSON.stringify({
              nombre: guest,
              evento: EVENT,
              asistencia: attending ? 'Sí' : 'No',
              acompanante_permitido: attending ? 'Sí, 1 acompañante' : 'No aplica',
              acompanante_nombre: attending ? (companion || 'Sin acompañante') : 'No aplica'
            }),
            signal: controller.signal
          });
        } finally {
          clearTimeout(timer);
        }
        if (!response.ok) throw Error('Formspree HTTP ' + response.status);
        saved = true;
      } catch (e) {
        error = e.message;
        console.warn('No se pudo registrar RSVP:', e);
      }
      
      pending = false;
      if (attending) {
        showTicket(saved, error);
      } else {
        render(`
          <div class="spark">✦</div>
          <div class="eyebrow">Gracias por responder</div>
          <h2 class="display" style="font-size:53px">¡Gracias,<br><em>${safe(guest)}!</em></h2>
          <div class="line"></div>
          <p class="desc">Qué pena que no puedas acompañarme. ¡Nos vemos en otra ocasión!</p>
          <div class="status">${saved ? 'Tu respuesta quedó registrada.' : 'No pudimos guardar tu respuesta en línea. Avísale al anfitrión directamente.'}</div>
          <button class="btn outline" id="back">VOLVER</button>
        `);
        document.getElementById('back').onclick = showInvite;
      }
    }

    function confetti() {
      const box = document.getElementById('confetti');
      box.innerHTML = '';
      for (let i = 0; i < 65; i++) {
        const p = document.createElement('i');
        p.className = 'piece';
        p.style.left = Math.random() * 100 + '%';
        p.style.background = ['#f0d39d', '#ffffff', '#6387b9', '#cfa760'][i % 4];
        p.style.animationDelay = Math.random() * 1.4 + 's';
        p.style.animationDuration = 2.5 + Math.random() * 2 + 's';
        p.style.setProperty('--dx', (Math.random() - .5) * 240 + 'px');
        box.appendChild(p);
      }
      setTimeout(() => box.innerHTML = '', 5400);
    }

    function showTicket(saved, error) {
      confetti();
      render(`
        <div class="spark">✦</div>
        <div class="eyebrow">Tu invitación está lista</div>
        <h2 class="display" style="font-size:52px">See you<br><em>there!</em></h2>
        <div class="ticket">
          <div class="label">BIRTHDAY NIGHT · PERSONAL INVITE</div>
          <div class="line"></div>
          <div class="sub">INVITACIÓN PARA</div>
          <div class="guest">${safe(guest)}</div>
          <div class="line"></div>
          <div class="label">VIERNES 23 OCTUBRE · 2026</div>
          <div class="sub">DESDE LAS 8:00 PM</div>
          <div class="value" style="font-size:34px">Chelsea</div>
          <div class="sub">Chill & Drink · Urdesa, Guayaquil</div>
          <p class="sub" style="margin:18px 0 0">${companion ? `✦ Acompañante: ${safe(companion)} ✦` : '✦ Asistencia individual ✦'}</p>
        </div>
        <div class="actions">
          <button id="download" class="btn gold">↓ GUARDAR MI INVITACIÓN</button>
          <button id="share" class="btn outline">↗ COMPARTIR</button>
        </div>
        <div class="status">${saved ? '✓ Tu asistencia quedó registrada.' : '⚠ Tu tarjeta está lista, pero la confirmación NO se guardó en línea. Avísale directamente al anfitrión.'}</div>
      `);
      document.getElementById('download').onclick = download;
      document.getElementById('share').onclick = share;
    }

    function makeCanvas() {
      const c = document.createElement('canvas');
      c.width = 1080;
      c.height = 1350;
      const x = c.getContext('2d');
      const bg = x.createLinearGradient(0, 0, 1080, 1350);
      bg.addColorStop(0, '#1c3855');
      bg.addColorStop(.5, '#0b192d');
      bg.addColorStop(1, '#050b15');
      x.fillStyle = bg;
      x.fillRect(0, 0, 1080, 1350);
      x.strokeStyle = '#d9b77d';
      x.lineWidth = 3;
      x.strokeRect(55, 55, 970, 1240);
      x.globalAlpha = .4;
      x.strokeRect(73, 73, 934, 1204);
      x.globalAlpha = 1;
      x.textAlign = 'center';

      function t(s, y, sz, color = '#fff5df', family = 'Georgia') {
        x.font = `${sz}px ${family}`;
        x.fillStyle = color;
        x.fillText(s, 540, y);
      }

      t('✦', 190, 85, '#ebc98c');
      t('YOU ARE INVITED', 290, 27, '#ebc98c', 'Arial');
      t('BIRTHDAY NIGHT', 425, 86, '#f4e3c3');
      x.strokeStyle = '#d9b77d';
      x.beginPath();
      x.moveTo(240, 500);
      x.lineTo(840, 500);
      x.stroke();
      t('INVITACIÓN PARA', 575, 25, '#ebc98c', 'Arial');
      
      let fs = 78;
      x.font = `${fs}px Georgia`;
      while (x.measureText(guest).width > 850 && fs > 25) {
        fs -= 2;
        x.font = `${fs}px Georgia`;
      }
      t(guest, 680, fs);
      t('VIERNES 23 DE OCTUBRE', 835, 48, '#ebc98c');
      t('2026 · DESDE LAS 8:00 PM', 905, 34);
      t('CHELSEA', 1030, 85, '#f4e3c3');
      t('URDESA · GUAYAQUIL', 1095, 32, '#ebc98c', 'Arial');
      
      let companionLabel = companion ? 'ACOMPAÑANTE: ' + companion : 'ASISTENCIA INDIVIDUAL';
      let cf = 27;
      x.font = `${cf}px Arial`;
      while (x.measureText(companionLabel).width > 850 && cf > 16) {
        cf -= 1;
        x.font = `${cf}px Arial`;
      }
      t(companionLabel, 1180, cf, '#d9b77d', 'Arial');
      t('PERSONAL INVITATION  ✦', 1230, 23, '#d9b77d', 'Arial');
      return c;
    }

    function download() {
      const a = document.createElement('a');
      a.download = 'Invitacion_Chelsea_' + guest.replace(/[^\p{L}\p{N}_-]/gu, '_') + '.png';
      a.href = makeCanvas().toDataURL('image/png');
      a.click();
    }

    async function share() {
      const c = makeCanvas();
      c.toBlob(async blob => {
        if (!blob) return download();
        const file = new File([blob], 'Invitacion_Chelsea.png', { type: 'image/png' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({ files: [file], title: 'Mi invitación de cumpleaños' });
            return;
          } catch (e) {
            if (e.name === 'AbortError') return;
          }
        }
        download();
      }, 'image/png');
    }
  </script>
</body>
</html>
